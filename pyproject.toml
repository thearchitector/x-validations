[project]
name = "xvalidations"
version = "0.1.0"
description = "Extra validations in your Pydantic models for better self-describing JSON schemata."
keywords = ["json-schema", "jsonpath", "pydantic", "validation"]
license = "BSD-3-Clause-Clear"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.3",
    "xvalid-py>=0.1.0,<0.2.0",
]

[project.urls]
Homepage = "https://github.com/thearchitector/x-validations"
Issues = "https://github.com/thearchitector/x-validations/issues"
Repository = "https://github.com/thearchitector/x-validations"

[tool.uv.sources]
xvalid-py = { workspace = true }

[tool.uv.workspace]
members = [".", "crates/xvalid-py"]

[dependency-groups]
dev = [
    "maturin>=1.0,<2.0",
    "mypy",
    "prek",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov",
    "pytest-crap",
    "ruff",
    "skylos",
    "types-jsonschema",
]

[tool.pytest.ini_options]
strict = true
addopts = "-ra -vv --crap --cov xvalidations --import-mode=importlib"
testpaths = ["tests", "crates/xvalid-py/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ["TYPE_CHECKING", "NotImplementedError"]

[tool.mypy]
strict = true

[tool.ruff]
unsafe-fixes = false
extend-include = ["*.md"]
extend-exclude = ["plans/"]

[tool.ruff.lint]
extend-select = ["ANN", "ASYNC", "PYI", "PT", "SIM", "TID", "PERF", "TRY", "PGH003"]
extend-ignore = ["TID252", "TRY003"]
preview = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"importlib.import_module".msg = "Do not dynamically import modules. Explicitly import them at the top of the file."
"__future__.annotations".msg = "The annotation future statement is disallowed."

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true
preview = true

[tool.skylos]
nesting = 4
exclude = ["tests", ".ruff_cache", "crates", "plans"]
ignore = [
    "SKY-L021",
    "SKY-Q701",
    "SKY-Q802",
    "SKY-Q803",
    "SKY-U005",
]

[tool.skylos.gate]
strict = true

[tool.uv.build-backend]
module-name = "xvalidations"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
