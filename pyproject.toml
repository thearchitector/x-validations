[project]
name = "xvalidations"
version = "0.1.0"
description = "Extra validations in your Pydantic models for better self-describing JSON schemata."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.3",
    "xvalid-py>=0.1.0",
]

[tool.uv.sources]
xvalid-py = { workspace = true }

[tool.uv.workspace]
members = [".", "crates/xvalid-py"]

[dependency-groups]
dev = [
    "maturin>=1.0,<2.0",
    "mypy",
    "prek",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov",
    "pytest-crap",
    "ruff",
    "skylos",
    "types-jsonschema",
]

[tool.pytest.ini_options]
addopts = "-ra -vv --crap --cov xvalidations"
testpaths = ["tests", "crates/xvalid-py/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]

[tool.mypy]
strict = true
exclude = ["^tests/"]

[tool.basedpyright]
ignore = ["tests"]

[tool.ruff]
unsafe-fixes = false
extend-include = ["*.md"]
extend-exclude = ["plans/"]

[tool.ruff.lint]
extend-select = ["B", "I", "ASYNC", "TC", "SIM", "PL", "TID", "PT", "PTH", "PERF"]
extend-ignore = ["PLR2004", "PLR0911", "PLR0912", "PLR0913", "TID252"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["TC"]

[tool.ruff.lint.flake8-type-checking]
strict = true
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"importlib.import_module".msg = "Do not dynamically import modules. Explicitly import them at the top of the file."
"__future__.annotations".msg = "The annotation future statement is disallowed."

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true
preview = true

[tool.skylos]
nesting = 4
exclude = ["tests", ".ruff_cache", "crates", "plans"]
ignore = [
    "SKY-L021",
    "SKY-Q701",
    "SKY-Q802",
    "SKY-Q803",
    "SKY-U005",
]

[tool.skylos.gate]
strict = true

[tool.uv.build-backend]
module-name = "xvalidations"
module-root = ""

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
