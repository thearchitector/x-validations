[project]
name = "pydantic-ajv"
version = "0.1.0"
description = "Native Pydantic rules compiled to Ajv-compatible JSON Schema."
readme = "README.md"
keywords = ["json-schema", "ajv", "pydantic", "validation", "json"]
license = "BSD-3-Clause-Clear"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.12,<3",
]

[project.urls]
Homepage = "https://github.com/thearchitector/x-validations"
Issues = "https://github.com/thearchitector/x-validations/issues"
Repository = "https://github.com/thearchitector/x-validations"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov",
    "pytest-crap",
    "mypy",
    "prek",
    "ruff",
]

[tool.pytest.ini_options]
strict = true
addopts = "-ra -vv --crap --cov pydantic_ajv --import-mode=importlib"
testpaths = ["tests"]

[tool.mypy]
explicit_package_bases = true
files = ["pydantic_ajv", "tests/typing_api.py"]
strict = true

[tool.ruff]
unsafe-fixes = false
extend-include = ["README.md"]

[tool.ruff.lint]
extend-select = ["ANN", "ASYNC", "PYI", "PT", "SIM", "TID", "PERF", "TRY", "PGH003"]
extend-ignore = ["TID252", "TRY003"]
preview = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"importlib.import_module".msg = "Do not dynamically import modules. Explicitly import them at the top of the file."
"__future__.annotations".msg = "The annotation future statement is disallowed."

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true
preview = true

[tool.uv.build-backend]
module-name = "pydantic_ajv"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
