repos:
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.7
      hooks:
          - id: ruff-check
            args:
                - --fix
                - --exit-non-zero-on-fix
          - id: ruff-format
            types_or: [python, markdown]
    - repo: local
      hooks:
          - id: typechek
            name: typecheck
            language: system
            entry: uv run mypy
            types: [python]
            exclude: ^tests/
            require_serial: true
            pass_filenames: false
    - repo: builtin
      hooks:
          - id: check-toml
          - id: check-yaml
            args:
                - --allow-multiple-documents
          - id: check-json
          - id: pretty-format-json
            args:
                - --autofix
          - id: end-of-file-fixer
          - id: trailing-whitespace
