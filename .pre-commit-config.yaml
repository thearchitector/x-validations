repos:
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.4
      hooks:
          - id: ruff-check
            args:
                - --fix
                - --exit-non-zero-on-fix
          - id: ruff-format
            types_or: [python, markdown]
    - repo: local
      hooks:
          - id: typechek
            name: typecheck
            language: system
            entry: uv run mypy
            types: [python]
            exclude: ^tests/
            require_serial: true
            pass_filenames: false
    - repo: local
      hooks:
          - id: cargo-fmt
            name: cargo fmt
            language: system
            entry: cargo fmt --all -- --check
            pass_filenames: false
          - id: cargo-check
            name: cargo check
            language: system
            entry: cargo check --workspace
            pass_filenames: false
          - id: clippy
            name: cargo clippy
            language: system
            entry: cargo clippy --workspace --all-targets -- -D warnings
            pass_filenames: false
    - repo: builtin
      hooks:
          - id: check-yaml
            args:
                - --allow-multiple-documents
          - id: end-of-file-fixer
          - id: trailing-whitespace
