repos:
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.4
      hooks:
          - id: ruff-check
            args:
                - --fix
                - --exit-non-zero-on-fix
          - id: ruff-format
            types_or: [python, markdown]
    - repo: local
      hooks:
          - id: typechek
            name: typecheck
            language: system
            entry: uv run mypy .
            types: [python]
            exclude: ^tests/
            require_serial: true
            pass_filenames: false
    - repo: https://github.com/FeryET/pre-commit-rust
      rev: v1.2.1
      hooks:
          - id: fmt
          - id: cargo-check
          - id: clippy
            args:
                - --fix
                - --allow-dirty
    - repo: local
      hooks:
          - id: skylos
            name: skylos
            language: system
            entry: uv run skylos . --quality --trace --coverage --pytest-fixtures --gate --llm
            types: [python]
            exclude: ^tests/
            require_serial: true
            pass_filenames: false
            verbose: true
    - repo: builtin
      hooks:
          - id: check-yaml
            args:
                - --allow-multiple-documents
          - id: end-of-file-fixer
          - id: trailing-whitespace
